name: repolis CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Must match backend/go.mod. These drifted apart (go.mod asked for
          # 1.26 while CI pinned 1.22), so the build could not have passed.
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go build -v ./...
      - run: go vet ./...
      - run: go test -v ./...

  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: install alsa and udev
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev
      # Layout invariants (no overlapping buildings, everything inside its
      # district) run on the host target; wasm is only the delivery format.
      - run: cargo test --release
      - run: cargo clippy --release -- -D warnings
      - name: install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - run: ./build-wasm.sh
      - uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: frontend/src/wasm

  frontend:
    runs-on: ubuntu-latest
    needs: engine
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: wasm
          path: frontend/src/wasm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
