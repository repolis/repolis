name: repolis CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# A second push supersedes the first. The engine job builds Bevy in release and
# can run ~18 minutes, so letting superseded runs finish is expensive.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

# Deliberately no `paths:` filters. Required status checks never report for a
# skipped job, so a filtered job leaves every PR that does not touch its paths
# waiting forever. Cost is controlled by caching and cancel-in-progress instead.

jobs:
  # Each job runs the same make target as a local `make check`.
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Must match backend/go.mod. These drifted apart once (go.mod asked
          # for 1.26 while CI pinned 1.22) and the build could not have passed.
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # -race matters here: single-flight job dedup, the SSE broadcast and the
      # atomic cache writes are all concurrent.
      - run: make check-backend

  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Version, components and targets come from engine/rust-toolchain.toml.
      - run: rustup toolchain install
        working-directory: ./engine
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      # Layout invariants (no overlapping buildings, everything inside its
      # district) run on the host target; wasm is only the delivery format.
      # Clippy only type-checks, so it shares little with the test build.
      - run: make check-engine

  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Most pushes do not touch the engine, so the frontend reuses the last
      # wasm instead of waiting for a cold Bevy release build.
      - id: cache
        uses: actions/cache@v4
        with:
          path: frontend/src/wasm
          key: wasm-${{ hashFiles('engine/src/**', 'engine/Cargo.toml', 'engine/Cargo.lock', 'engine/build-wasm.sh') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: rustup toolchain install
        working-directory: ./engine
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      # Pinned and cached, rather than piping an unversioned installer to sh
      # on every run.
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.1
      - if: steps.cache.outputs.cache-hit != 'true'
        run: engine/build-wasm.sh
      - uses: actions/upload-artifact@v7
        with:
          name: wasm
          path: frontend/src/wasm
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: wasm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Read from frontend/.nvmrc for the same reason Go reads go.mod.
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          name: wasm
          path: frontend/src/wasm
      - run: npm ci
        working-directory: ./frontend
      # Lint errors fail the build; the remaining warnings are the WebGPU shims
      # in main.tsx, where `any` is the honest type for patching browser globals.
      - run: make check-frontend
      - run: npm run build
        working-directory: ./frontend
