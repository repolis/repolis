name: repolis CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.modified, 'backend/') || github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: ./backend
    
    steps:
    - uses: actions/checkout@v4
    - name: set up go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
    - name: build go
      run: go build -v ./...
    - name: test go
      run: go test -v ./...

  build-engine:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.modified, 'engine/') || github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: ./engine
        
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown
    - name: install wasm-pack
      run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
    - name: build wasm package
      run: wasm-pack build --target web

  build-frontend:
    runs-on: ubuntu-latest
    needs: build-engine 
    defaults:
      run:
        working-directory: ./frontend
        
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Rebuild Wasm for Vite
      run: |
        curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
        cd ../engine && wasm-pack build --target web
        
    - name: install npm dependencies
      run: npm install
    - name: build app
      run: npm run build
