version: 2

updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: monthly
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    groups:
      frontend:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /engine
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "bevy"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      engine:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
