version: 2

# Grouped and monthly: this is a three-language repository and ungrouped weekly
# updates would produce more pull requests than the project can review.
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: monthly
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    groups:
      frontend:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /engine
    schedule:
      interval: monthly
    groups:
      engine:
        patterns: ["*"]

  # The reason this file exists: every action in the workflow was between two
  # and four major versions behind before anything flagged it.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
