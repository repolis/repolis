[package]
name = "engine"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bevy = "0.14"
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
getrandom = { version = "0.3.4", features = ["wasm_js"] }
uuid = { version = "1.24", features = ["js"] }
voronoice = "0.2.0"

[dependencies.web-sys]
version = "0.3"
features = ["console", "Window", "Document", "CustomEvent", "CustomEventInit"]

# Optimize for Wasm size and speed
[profile.release]
opt-level = "s"
lto = true
