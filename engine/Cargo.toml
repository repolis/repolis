[package]
name = "engine"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Only what the city uses. The default set adds audio and gamepads (which need
# alsa and udev to build), text, UI, glTF and more: compile time and wasm size.
# tonemapping_luts is required by the camera's default tonemapper, x11 by winit on Linux.
bevy = { version = "0.20", default-features = false, features = [
    "std",
    "async_executor",
    "bevy_asset",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_log",
    "bevy_pbr",
    "bevy_render",
    "bevy_winit",
    "tonemapping_luts",
    "web",
    "webgl2",
    "webgpu",
    "x11",
    "zstd_rust",
] }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
getrandom = { version = "0.3.4", features = ["wasm_js"] }
uuid = { version = "1.24", features = ["js"] }

[dev-dependencies]
serde_json = "1"

[dependencies.web-sys]
version = "0.3"
features = ["console", "Window", "Document", "CustomEvent", "CustomEventInit"]

# Optimize for Wasm execution speed
[profile.release]
opt-level = 3
lto = true

# For `npm run dev` (build-wasm.sh --dev): without LTO and wasm-opt a one-file
# change rebuilds in seconds instead of ~25 s, still at full opt-level.
[profile.wasm-dev]
inherits = "release"
lto = false
incremental = true
codegen-units = 256
